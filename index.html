</style></head><body><main class="app"><header><div><h1>Five of a Kind</h1><div class="subtitle">A game of chance. A little strategy.</div></div><nav class="nav"><button id="rules">Rules</button><button id="sound">Sound on</button><button id="new">New game</button></nav></header><div class="layout"><section class="table" aria-label="Dice table"><div class="round"><span id="round">Round 1 / 13</span><span id="record"></span></div><div class="badge">Five dice · Three rolls · Your choice</div><div class="dice" id="dice"></div><div class="status" id="status" role="status" aria-live="polite"></div><div class="actions"><button class="primary" id="roll">Roll dice</button><span class="rolls" id="rolls"></span></div><div class="hint">Tap dice to hold them. Choose a score to finish your turn.</div></section><section class="score" aria-label="Scorecard"><div class="scorehead"><span>SCORECARD</span><span>YOU</span><span>COMPUTER</span></div><div class="rows" id="rows"></div><div class="row bonus"><span>Upper bonus <small>63 earns 35</small></span><span class="number" id="yb"></span><span class="number" id="cb"></span></div><div class="row total"><span>TOTAL</span><span class="number" id="yt"></span><span class="number" id="ct"></span></div></section></div><footer><span>Free to play · Lifetime ad removal $4.99 CAD</span><span>Testing: ads off <button id="about" style="padding:0 4px;font-size:10px">Details</button></span></footer></main><dialog id="modal"></dialog><div id="celebration" class="celebration" hidden role="status" aria-live="polite"></div>
<script>
'use strict';
const CATS=['Ones','Twos','Threes','Fours','Fives','Sixes','Three of a kind','Four of a kind','Full house','Small straight','Large straight','Five of a kind','Chance'];
const DETAILS=['1s','2s','3s','4s','5s','6s','Sum of dice','Sum of dice','25 points','30 points','40 points','50 + repeats','Sum of dice'];
const PIPS=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const ADS_LIVE=false; // Connect a real ad provider and verified purchase service only at launch.
const KEY='five-of-a-kind-v1';const $=id=>document.getElementById(id);let s,epoch=0,sounding=true,volume=1,ctx,rolling=false,celebrationTimer;
function score(d,k){let c=Array(7).fill(0);d.forEach(v=>c[v]++);let sum=d.reduce((a,b)=>a+b,0),max=Math.max(...c),u=[...new Set(d)].sort().join('');if(k<6)return c[k+1]*(k+1);if(k===6)return max>=3?sum:0;if(k===7)return max>=4?sum:0;if(k===8)return c.includes(3)&&c.includes(2)?25:0;if(k===9)return ['1234','2345','3456'].some(v=>u.includes(v))?30:0;if(k===10)return u==='12345'||u==='23456'?40:0;if(k===11)return max===5?50:0;return sum;}
function upper(a){return a.slice(0,6).reduce((v,x)=>v+(x??0),0)}function bonus(a){return upper(a)>=63?35:0}function total(a){return a.reduce((v,x)=>v+(x??0),0)+bonus(a)}
function canRepeat(d,a,k){return k===11&&a[11]>=50&&score(d,11)===50}
function available(d,a,k){return a[k]===null||canRepeat(d,a,k)}
function recordScore(d,a,k){if(canRepeat(d,a,k)){a[k]+=50;return 50}let points=score(d,k);a[k]=points;return points}
function read(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function start(){epoch++;clearCelebration();s={you:Array(13).fill(null),cpu:Array(13).fill(null),dice:[1,2,3,4,5],held:Array(5).fill(false),used:0,turn:'you',round:1,done:false,stats:read()?.stats||{games:0,wins:0,best:0}};rolling=false;save();render()}
function rand(){let a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=4294967292);return a[0]%6+1}
function audioReady(){if(!sounding||volume===0)return false;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();return true}catch{return false}}
// Original, soft game-show-inspired cues; no external audio files needed.
function note(freq,when,length,level){let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(level*3*volume,when+.012);g.gain.exponentialRampToValueAtTime(.0001,when+length);o.connect(g).connect(ctx.destination);o.start(when);o.stop(when+length+.02)}
function cue(notes,step=.075,level=.09){if(!audioReady())return;let t=ctx.currentTime;notes.forEach((f,i)=>note(f,t+i*step,i===notes.length-1?.28:.13,level))}
function tone(){cue([523.25,659.25,783.99],.07,.075)}
function holdSound(held){cue(held?[659.25,880]:[659.25,523.25],.055,.055)}
function rollSound(){let motifs=[[392,493.88,587.33,783.99],[440,554.37,659.25,880],[349.23,440,523.25,698.46]];cue(motifs[Math.floor(Math.random()*motifs.length)],.085,.065)}
function scoreSound(){cue([523.25,783.99,1046.5],.08,.075)}
function victory(){if(!audioReady())return;let t=ctx.currentTime;[523.25,659.25,783.99,659.25,783.99,1046.5].forEach((f,i)=>note(f,t+i*.13,i===5?.85:.23,.17));[523.25,659.25,783.99].forEach(f=>note(f,t+.78,.9,.045))}
function clearCelebration(){clearTimeout(celebrationTimer);$('celebration').hidden=true;$('celebration').innerHTML=''}
function celebrate(computerHit=false){clearCelebration();let e=epoch;$('celebration').innerHTML=Array.from({length:36},(_,i)=>`<i class="spark" style="--x:${(i*37)%100}%;--delay:${-(i%9)*.2}s;--c:${i%3?'#e9cc8c':'#fff7de'}"></i>`).join('')+`<div class="celebrate-card"><strong>${computerHit?'Computer: ':''}Five of a Kind!</strong><span>ALL FIVE DICE MATCH</span></div>`;$('celebration').hidden=false;victory();celebrationTimer=setTimeout(()=>{if(epoch===e)clearCelebration()},3000)}

function render(){let active=s.turn==='you'&&!s.done&&!rolling; $('round').textContent=s.done?'Game complete':`Round ${s.round} / 13`;$('record').textContent=`Wins ${s.stats.wins} · Best ${s.stats.best}`;$('dice').classList.toggle('rolling',rolling);$('dice').innerHTML='';s.dice.forEach((v,i)=>{let b=document.createElement('button');b.className='die'+(s.held[i]?' held':'');b.disabled=!active||s.used===0;b.setAttribute('aria-label',`Die ${i+1}: ${v}${s.held[i]?', held':''}`);b.setAttribute('aria-pressed',String(s.held[i]));b.innerHTML=Array.from({length:9},(_,p)=>`<span class="pip ${PIPS[v-1].includes(p)?'':'empty'}"></span>`).join('');b.onclick=()=>{s.held[i]=!s.held[i];holdSound(s.held[i]);save();render()};$('dice').append(b)});$('roll').disabled=!active||s.used>=3||s.held.every(Boolean);$('roll').textContent=s.used===0?'Roll dice':'Roll again';$('rolls').textContent=`${3-s.used} rolls left`;$('status').textContent=s.done?`You ${total(s.you)} · Computer ${total(s.cpu)}. ${total(s.you)>total(s.cpu)?'You win!':total(s.you)===total(s.cpu)?'A tie!':'Computer wins.'}`:s.turn==='cpu'?'Computer is taking its turn…':s.used===0?'Your turn. Roll the five dice.':s.used<3?canRepeat(s.dice,s.you,11)?'Five of a Kind! Choose +50 or an available category.':'Hold dice to keep them, roll again, or choose a score.':canRepeat(s.dice,s.you,11)?'Five of a Kind! Choose +50 or an available category.':'Choose a score on your scorecard.';$('rows').innerHTML='';CATS.forEach((name,k)=>{let row=document.createElement('div');row.className='row';let repeat=canRepeat(s.dice,s.you,k),used=s.you[k]!==null&&!repeat;row.innerHTML=`<span>${name} <small>${DETAILS[k]}</small></span><button class="pick" ${used||!active||s.used===0?'disabled':''} aria-label="${used?name+': '+s.you[k]:repeat?'Add 50 points to Five of a Kind; new total '+(s.you[k]+50):'Score '+name+' for '+score(s.dice,k)+' points'}">${repeat&&active&&s.used>0?'＋50 → '+(s.you[k]+50):s.you[k]!==null?s.you[k]:s.used>0&&s.turn==='you'?score(s.dice,k):'—'}</button><span class="number">${s.cpu[k]??'—'}</span>`;row.querySelector('button').onclick=()=>choose(k);$('rows').append(row)});$('yb').textContent=bonus(s.you)||`${upper(s.you)}/63`;$('cb').textContent=bonus(s.cpu)||`${upper(s.cpu)}/63`;$('yt').textContent=total(s.you);$('ct').textContent=total(s.cpu)}
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function roll(){if(rolling||s.done||s.turn!=='you'||s.used>=3)return;let e=epoch;rolling=true;rollSound();render();await delay(420);if(e!==epoch)return;s.dice=s.dice.map((v,i)=>s.held[i]?v:rand());s.used++;rolling=false;let hit=score(s.dice,11)===50&&!s.celebrated;if(hit)s.celebrated=true;save();render();if(hit)celebrate()}
function utility(d,k,a){let val=score(d,k);if(k<6)return val*1.65-(k+1)*3;if(k===12)return val-19;return val-([0,0,0,0,0,0,15,12,12,15,17,19][k]);}
function best(d,a){let k=-1,v=-Infinity;a.forEach((x,i)=>{if(available(d,a,i)){let t=utility(d,i,a);if(t>v){v=t;k=i}}});return {k,v}}
function holds(d,a){let bestMask=31,bestVal=best(d,a).v;for(let mask=0;mask<31;mask++){let val=0;for(let n=0;n<65;n++){let trial=d.map((v,i)=>(mask>>i)&1?v:1+Math.floor(Math.random()*6));val+=best(trial,a).v}val/=65;if(val>bestVal){bestVal=val;bestMask=mask}}return d.map((_,i)=>!!((bestMask>>i)&1))}
async function choose(k){if(rolling||s.done||s.turn!=='you'||!s.used||!available(s.dice,s.you,k))return;clearCelebration();s.celebrated=false;recordScore(s.dice,s.you,k);scoreSound();s.turn='cpu';s.used=0;s.held.fill(false);save();render();await computer()}
async function computer(){let e=epoch,celebrated=false;for(let r=0;r<3;r++){await delay(550);if(e!==epoch)return;rolling=true;rollSound();render();await delay(300);if(e!==epoch)return;s.dice=s.dice.map((v,i)=>s.held[i]?v:rand());s.used=r+1;rolling=false;render();if(score(s.dice,11)===50&&!celebrated){celebrated=true;celebrate(true)}if(r<2){s.held=holds(s.dice,s.cpu);render();if(s.held.every(Boolean))break}}await delay(600);if(e!==epoch)return;let k=best(s.dice,s.cpu).k;recordScore(s.dice,s.cpu,k);s.held.fill(false);s.used=0;if(s.round===13){s.done=true;s.turn='you';s.stats.games++;if(total(s.you)>total(s.cpu))s.stats.wins++;s.stats.best=Math.max(s.stats.best,total(s.you));save();render();finish()}else{s.round++;s.turn='you';save();render()}}
function modal(html){$('modal').innerHTML=html;$('modal').showModal();$('modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('modal').close())}
function finish(){modal(`<h2>${total(s.you)>total(s.cpu)?'You win':total(s.you)===total(s.cpu)?'A tie':'Computer wins'}</h2><p>You scored <strong>${total(s.you)}</strong>. Computer scored <strong>${total(s.cpu)}</strong>.</p><p class="record">Best score: ${s.stats.best} · Games won: ${s.stats.wins} / ${s.stats.games}</p><div class="dialogactions"><button id="again" class="primary">Play again</button><button id="shareScore">Share my score</button><button id="shareGame">Share this game</button><button data-close>View scorecard</button></div>`);$('again').onclick=()=>{$('modal').close();start()};$('shareScore').onclick=()=>share(`I scored ${total(s.you)} in Five of a Kind!`);$('shareGame').onclick=()=>share('Play Five of a Kind — five dice, three rolls, and a computer opponent.');/* Launch: request a real interstitial after every third completed game when ADS_LIVE and a verified lifetime entitlement is absent. No sample ads or pretend purchase. */}
async function share(text){let url=/^https?:/.test(location.protocol)?location.href:'';try{if(navigator.share)await navigator.share({title:'Five of a Kind',text,...(url?{url}:{})});else if(navigator.clipboard){await navigator.clipboard.writeText(text+(url?' '+url:''));alert('Copied to clipboard.')}else{prompt('Copy this text:',text+(url?' '+url:''))}}catch(e){if(e.name!=='AbortError')prompt('Copy this text:',text+(url?' '+url:''))}}
$('roll').onclick=roll;$('new').onclick=()=>{if(!s.done&&s.you.some(x=>x!==null)){modal('<h2>Start a new game?</h2><p>This will replace the current scorecard.</p><div class="dialogactions"><button id="confirmNew" class="primary">Start new game</button><button data-close>Keep playing</button></div>');$('confirmNew').onclick=()=>{$('modal').close();start()}}else start()};$('sound').onclick=()=>{modal(`<h2>Sound</h2><p>Game volume: <strong id="volumeLabel">${Math.round(volume*100)}%</strong></p><input id="volumeControl" aria-label="Game volume" type="range" min="0" max="100" value="${Math.round(volume*100)}" style="width:100%;accent-color:#e9cc8c"><div class="dialogactions" style="margin-top:18px"><button id="muteSound">${sounding?'Mute':'Unmute'}</button><button id="testSound">Test game sound</button><button id="testCelebration">Test celebration</button><button data-close>Done</button></div>`);$('volumeControl').oninput=ev=>{volume=Number(ev.target.value)/100;$('volumeLabel').textContent=Math.round(volume*100)+'%'};$('muteSound').onclick=()=>{sounding=!sounding;$('muteSound').textContent=sounding?'Mute':'Unmute';$('sound').textContent=sounding?'Sound on':'Sound off'};$('testSound').onclick=tone;$('testCelebration').onclick=victory};$('about').onclick=()=>modal('<h2>Free to play</h2><p>The complete game is free. At launch, an ad will appear after every three completed games.</p><p><strong>$4.99 CAD, paid once, removes ads for life.</strong> It adds no paid game features.</p><p>Ads and purchases are disabled during testing. Payment will be available when the game launches.</p><button data-close>Close</button>');$('rules').onclick=()=>modal('<h2>How to play</h2><p>You and the computer each get 13 turns. Roll up to three times per turn. Tap any dice to hold or release them, then roll the rest. Choose one unused category to finish your turn—even if it scores zero—or choose a repeat Five of a Kind for another 50 points.</p><ul><li>Ones through Sixes: add dice showing that number. Reach 63 in these six categories for a 35-point bonus.</li><li>Three or Four of a kind: at least that many matching dice; score the sum of all five.</li><li>Full house: exactly three of one number and two of another; 25 points.</li><li>Small straight: four consecutive numbers; 30 points. Large straight: five consecutive numbers; 40 points.</li><li>Five of a kind: five matching dice; 50 points. Once you have scored 50 here, another five matching dice lets you choose another 50 in this same row (100, 150, and so on), or score an unused category such as the matching number. Choose one, not both. A row scored zero cannot earn repeats. The computer follows the same rule.</li><li>Chance: add all five dice.</li></ul><p>Highest total wins. Each scoring choice uses one of your 13 turns, including repeat Five of a Kind. Unused categories count as zero at the end. Both you and the computer get a celebration when five matching dice appear, once per turn. There is no wildcard scoring.</p><button data-close>Let’s play</button>');
let prev=read();if(prev&&Array.isArray(prev.you)&&prev.you.length===13&&Array.isArray(prev.cpu)&&prev.cpu.length===13&&Array.isArray(prev.dice)&&prev.dice.length===5&&prev.dice.every(x=>Number.isInteger(x)&&x>=1&&x<=6)&&Array.isArray(prev.held)&&prev.held.length===5&&prev.stats&&prev.round>=1&&prev.round<=13){s=prev;render();if(s.turn==='cpu'&&!s.done){s.used=0;s.held.fill(false);computer()}}else start();
</script></body></html>
